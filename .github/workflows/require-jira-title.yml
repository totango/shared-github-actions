name: Jira title policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  require-jira-title:
    name: Require Jira issue key in PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request title
        uses: actions/github-script@v7
        with:
          script: |
            const jiraKeyPattern = '\\b[A-Z][A-Z0-9]+-[0-9]+\\b';
            const title = context.payload.pull_request?.title ?? '';
            const pattern = new RegExp(jiraKeyPattern);
            const match = title.match(pattern);

            if (match) {
              const message = `PR title contains Jira issue key ${match[0]}.`;
              core.notice(message);
              await core.summary.addHeading('Jira title policy').addRaw(message).write();
              return;
            }

            const message = `PR title must contain an uppercase Jira issue key matching ${jiraKeyPattern} (for example, UNI-123 Add workflow enrollment validation).`;
            core.error(message);
            await core.summary
              .addHeading('Jira title policy')
              .addRaw(`❌ ${message}`)
              .write();
            core.setFailed(message);
